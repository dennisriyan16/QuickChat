name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1' # CodeIgniter 4 typically uses 7.4 or 8.1+
        extensions: intl, mbstring, sqlite3
        coverage: none

    - name: Install Dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    - name: Run PHPUnit Tests
      # Assuming you have tests set up. If not, this step can be removed or modified.
      run: vendor/bin/phpunit

  deploy-to-cpanel:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    needs: build-and-test # This ensures deployment ONLY happens if tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Only deploy on push to main

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: FTP Deploy
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # The directory on your cPanel where the files should go. Change if needed.
        server-dir: /public_html/
